<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    html, body, #host { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.45); font: 13px sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div id="host"></div>
  <div id="status">正在加载 Live2D…</div>
  <script src="pixi.min.js"></script>
  <script>
    let app = null;
    let model = null;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error("脚本加载失败：" + src));
        document.head.appendChild(script);
      });
    }

    function resize() {
      if (!app || !model) return;
      const host = document.getElementById("host");
      const width = Math.max(1, host.clientWidth);
      const height = Math.max(1, host.clientHeight);
      app.renderer.resize(width, height);
      const originalWidth = Number(model.internalModel?.originalWidth) || 1;
      const originalHeight = Number(model.internalModel?.originalHeight) || 1;
      const scale = Math.min(width / originalWidth, height / originalHeight) * 0.98;
      model.scale.set(scale);
      model.position.set(
        (width - originalWidth * scale) / 2,
        height - originalHeight * scale,
      );
    }

    window.startLive2D = async function (coreUrl, modelUrl) {
      try {
        if (!window.Live2DCubismCore) await loadScript(coreUrl);
        if (!window.PIXI.live2d) await loadScript("cubism4.min.js");
        PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
        app = new PIXI.Application({
          backgroundAlpha: 0,
          antialias: true,
          autoDensity: true,
          resolution: Math.min(2.5, Math.max(2, window.devicePixelRatio || 1)),
        });
        const view = app.view;
        view.style.width = "100%";
        view.style.height = "100%";
        view.style.display = "block";
        document.getElementById("host").appendChild(view);
        model = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: false });
        model.anchor.set(0, 0);
        app.stage.addChild(model);
        window.addEventListener("resize", resize);
        new ResizeObserver(resize).observe(document.getElementById("host"));
        setTimeout(resize, 100);
        document.getElementById("status").style.display = "none";
        model.motion("Idle").catch(() => undefined);
      } catch (error) {
        console.error("[yf-live2d] failed", error);
        document.getElementById("status").textContent = "Live2D 加载失败：" + error.message;
      }
    };
  </script>
</body>
</html>
